name: Lint & Type Check

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run Lint Check
        run: npm run lint:check

      - name: Run TypeScript Check
        run: npm run type-check

      - name: Run Tests
        run: npm test
